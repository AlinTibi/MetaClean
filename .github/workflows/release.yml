name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Determine pinned Wails CLI version from go.mod
        id: wails_version
        shell: pwsh
        run: |
          $match = Select-String -Path go.mod -Pattern 'github.com/wailsapp/wails/v2\s+(\S+)'
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ steps.wails_version.outputs.version }}

      - name: Build application
        run: wails build -clean -s

      # ExifTool is Phil Harvey's software (exiftool.org). His official
      # Windows build is published via SourceForge, but that download
      # blocks automated/CI requests (HTTP 403 — verified against a real
      # GitHub Actions windows-latest runner, not a local quirk), so this
      # does NOT download directly from SourceForge/the publisher. It
      # instead runs scripts/fetch-exiftool.ps1, which pulls the pinned
      # exiftool-vendored.exe npm package — a transparent, MIT-licensed
      # repackaging that vendors Phil Harvey's official Windows build
      # unmodified. That script owns the pinned package version and
      # verifies its integrity (npm's published SHA-512) before
      # extracting anything; this is the same script contributors run
      # locally, kept in one place. Runtime stays fully offline — this
      # only ever runs at build/release time.
      - name: Fetch pinned ExifTool (vendored npm package)
        shell: pwsh
        run: ./scripts/fetch-exiftool.ps1

      - name: Bundle ExifTool with the built application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/bin/exiftool | Out-Null
          Copy-Item -Recurse -Force tools/exiftool/* build/bin/exiftool/
          & "build/bin/exiftool/exiftool.exe" -ver

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "MetaClean-$version-win-x64.zip"
          $checksumName = "$zipName.sha256"

          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item "build/bin/MetaClean.exe" "stage/MetaClean.exe"
          Copy-Item -Recurse "build/bin/exiftool" "stage/exiftool"
          Copy-Item "README.md" "stage/README.md"
          Copy-Item "LICENSE" "stage/LICENSE"
          Copy-Item "THIRD_PARTY_NOTICES.md" "stage/THIRD_PARTY_NOTICES.md"

          Compress-Archive -Path "stage/*" -DestinationPath $zipName -CompressionLevel Optimal
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -NoNewline $checksumName

          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "checksum_name=$checksumName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          "${{ steps.package.outputs.zip_name }}"
          "${{ steps.package.outputs.checksum_name }}"
          --title "MetaClean ${{ github.ref_name }}"
          --generate-notes
