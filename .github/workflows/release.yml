name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Fetch pinned ExifTool
        shell: pwsh
        run: ./scripts/fetch-exiftool.ps1

      - name: Go vet
        run: go vet ./...

      - name: Go test
        env:
          METACLEAN_EXIFTOOL_PATH: ${{ github.workspace }}/tools/exiftool/exiftool.exe
        run: go test ./... -v

      - name: Determine pinned Wails CLI version from go.mod
        id: wails_version
        shell: pwsh
        run: |
          $match = Select-String -Path go.mod -Pattern 'github.com/wailsapp/wails/v2\s+(\S+)'
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ steps.wails_version.outputs.version }}

      - name: Build application
        run: wails build -clean -s -webview2 browser

      - name: Package release with the pinned ExifTool and support files
        id: package
        shell: pwsh
        run: |
          $package = ./scripts/package-release.ps1 -Tag "${{ github.ref_name }}"
          "zip_name=$($package.Zip)" >> $env:GITHUB_OUTPUT
          "checksum_name=$($package.Checksum)" >> $env:GITHUB_OUTPUT

      - name: Attest release ZIP provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '${{ steps.package.outputs.zip_name }}'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          "${{ steps.package.outputs.zip_name }}"
          "${{ steps.package.outputs.checksum_name }}"
          --verify-tag --title "MetaClean ${{ github.ref_name }}"
          --generate-notes
